<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css')}}">
    <title>Здания и сооружения</title>
</head>
<body>
  <h1>
    Самые высокие здания и сооружения
  </h1>
    <table>
      <!-- формируем заголовок таблицы (имена столбцов) -->
      <thead>
        <tr>
          <!-- выводим имя каждого столбца -->
            {% for item in type_buildings_head %}
              <th> {{ item }} </th>
            {% endfor %}
          </tr>
      </thead>
      <tbody>
      <!-- для всех строк таблицы -->
        {% for row in type_buildings_body %}
          <tr>
          <!-- выводим значение каждого столбца -->
            {% for item in row %}
              <td> {{ item }} </td>
            {% endfor %}
          </tr>
          {% endfor %}
        </tbody>
    </table>
</body>
</html>
